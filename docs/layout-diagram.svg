<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="690" viewBox="0 0 1260 690" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111827;
      --sub: #475569;
      --mut: #64748B;
      --lbl: #334155;
      --box: #ffffff;
      --boxline: #1F2937;
      --io: #EEF1F4;
      --ioline: #5B6B7F;
      --frame: #94A3B8;
      --blue: #0868E0;
      --org: #C66A36;
      --teal: #0E7C66;
      --gray: #64748B;
      --lblb: #1E4E8C;
      --lblo: #8C4A1F;
      --lblg: #475569;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --sub: #9198A1;
        --mut: #8C959F;
        --lbl: #B1BAC4;
        --box: #161B22;
        --boxline: #6E7681;
        --io: #21262D;
        --ioline: #6E7681;
        --frame: #6E7681;
        --blue: #4493F8;
        --org: #F0883E;
        --teal: #33C29D;
        --gray: #8C959F;
        --lblb: #79B8FF;
        --lblo: #F0A868;
        --lblg: #B1BAC4;
      }
    }
    .bg { fill: var(--bg); }
    .t  { fill: var(--fg); }
    .s  { fill: var(--sub); }
    .m  { fill: var(--mut); }
    .lg { fill: var(--lbl); }
    .box   { fill: var(--box); stroke: var(--boxline); stroke-width: 1.5; }
    .logic { fill: var(--box); stroke: var(--mut); stroke-width: 1.4; stroke-dasharray: 5 3; }
    .io    { fill: var(--io); stroke: var(--ioline); stroke-width: 1.3; }
    .frame { fill: none; stroke: var(--frame); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .lb-b { fill: var(--blue); }
    .lb-o { fill: var(--org); }
    .lb-t { fill: var(--teal); }
    .ln-b { stroke: var(--blue); stroke-width: 2.2; fill: none; }
    .ln-o { stroke: var(--org); stroke-width: 2.2; fill: none; }
    .ln-g { stroke: var(--gray); stroke-width: 1.8; fill: none; }
    .dotg { fill: var(--gray); }
    .lb-g { fill: var(--lblg); }
  </style>
  <defs>
    <marker id="aBlue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="var(--blue)"/></marker>
    <marker id="aOrange" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="var(--org)"/></marker>
    <marker id="aGray" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="var(--gray)"/></marker>
  </defs>

  <rect x="0" y="0" width="1260" height="690" class="bg"/>
  <text x="20" y="36" font-size="16.5" font-weight="bold" class="t">Snake on the DE1-SoC — module &amp; signal layout</text>

  <!-- top-level container -->
  <rect x="170" y="56" width="860" height="560" rx="10" class="frame"/>
  <text x="186" y="78" font-size="12.5" font-weight="bold" class="s">DE1_SoC (DE1_SoC.sv)</text>

  <!-- ===================== signals ===================== -->
  <!-- clock chain (blue) -->
  <line x1="150" y1="122" x2="194" y2="122" class="ln-b" marker-end="url(#aBlue)"/>
  <polyline points="285,156 285,194" class="ln-b" marker-end="url(#aBlue)"/>
  <line x1="370" y1="232" x2="434" y2="232" class="ln-b" marker-end="url(#aBlue)"/>
  <polyline points="590,232 700,232 700,274" class="ln-b" marker-end="url(#aBlue)"/>

  <!-- game data (orange) -->
  <line x1="150" y1="316" x2="194" y2="316" class="ln-o" marker-end="url(#aOrange)"/>
  <line x1="370" y1="316" x2="434" y2="316" class="ln-o" marker-end="url(#aOrange)"/>
  <line x1="590" y1="316" x2="634" y2="316" class="ln-o" marker-end="url(#aOrange)"/>
  <line x1="370" y1="505" x2="634" y2="505" class="ln-o" marker-end="url(#aOrange)"/>
  <polyline points="684,390 684,470" class="ln-o" marker-end="url(#aOrange)"/>
  <polyline points="732,390 732,470" class="ln-o" marker-end="url(#aOrange)"/>
  <polyline points="780,470 780,390" class="ln-o" marker-end="url(#aOrange)"/>
  <polyline points="820,505 935,505 935,396" class="ln-o" marker-end="url(#aOrange)"/>
  <line x1="820" y1="310" x2="854" y2="310" class="ln-o" marker-end="url(#aOrange)"/>
  <line x1="1010" y1="370" x2="1084" y2="370" class="ln-o" marker-end="url(#aOrange)"/>

  <!-- control: reset routing tree (solid gray, arrowheads only at module edges) -->
  <line x1="150" y1="452" x2="186" y2="452" class="ln-g"/>
  <line x1="186" y1="330" x2="186" y2="505" class="ln-g"/>
  <circle cx="186" cy="452" r="2.5" class="dotg"/>
  <line x1="186" y1="330" x2="194" y2="330" class="ln-g" marker-end="url(#aGray)"/>
  <line x1="186" y1="505" x2="194" y2="505" class="ln-g" marker-end="url(#aGray)"/>

  <!-- control: game over -->
  <polyline points="795,280 795,142 1084,142" class="ln-g" marker-end="url(#aGray)"/>

  <!-- signal labels -->
  <text x="172" y="114" font-size="10" text-anchor="middle" class="lb-b">50 MHz</text>
  <text x="293" y="180" font-size="10" class="lb-b">clkSelect ≈48.8 kHz</text>
  <text x="402" y="224" font-size="10" text-anchor="middle" class="lb-b">GT ≈3 Hz</text>
  <text x="645" y="224" font-size="10" text-anchor="middle" class="lb-b">oneGT</text>

  <text x="615" y="309" font-size="10.5" text-anchor="middle" class="lb-o">mov[1:0]</text>
  <text x="502" y="497" font-size="11" text-anchor="middle" class="lb-o">randNum[7:0]</text>
  <text transform="rotate(-90 676 430)" x="676" y="430" font-size="10" text-anchor="middle" class="lb-o">SnPos</text>
  <text transform="rotate(-90 724 430)" x="724" y="430" font-size="10" text-anchor="middle" class="lb-o">ateApple</text>
  <text transform="rotate(-90 780 430)" x="780" y="430" font-size="10" text-anchor="middle" class="lb-o">AplPos</text>
  <text x="942" y="478" font-size="10.5" class="lb-o">AplPos (red)</text>
  <text transform="rotate(-90 843 356)" x="843" y="356" font-size="10" text-anchor="middle" class="lb-o">SnPos (green)</text>
  <text x="1052" y="361" font-size="10" text-anchor="middle" class="lb-o">GPIO_1</text>
  <text x="940" y="132" font-size="10.5" text-anchor="middle" class="lb-g">gameOver</text>
  <text x="290" y="556" font-size="10" text-anchor="middle" class="lb-g">Reset = SW[9] — resets all modules (branches omitted)</text>

  <!-- ===================== external I/O boxes ===================== -->
  <g>
    <rect x="20" y="100" width="130" height="44" rx="8" class="io"/>
    <text x="85" y="118" font-size="13" font-weight="bold" text-anchor="middle" class="t">CLOCK_50</text>
    <text x="85" y="134" font-size="9.5" text-anchor="middle" class="s">50 MHz board clock</text>

    <rect x="20" y="300" width="130" height="44" rx="8" class="io"/>
    <text x="85" y="318" font-size="13" font-weight="bold" text-anchor="middle" class="t">KEY[0..3]</text>
    <text x="85" y="334" font-size="9.5" text-anchor="middle" class="s">pushbtn (act. low)</text>

    <rect x="20" y="430" width="130" height="44" rx="8" class="io"/>
    <text x="85" y="448" font-size="13" font-weight="bold" text-anchor="middle" class="t">SW[9]</text>
    <text x="85" y="464" font-size="9.5" text-anchor="middle" class="s">reset switch</text>

    <rect x="1090" y="120" width="150" height="44" rx="8" class="io"/>
    <text x="1165" y="138" font-size="13" font-weight="bold" text-anchor="middle" class="t">LEDR[0]</text>
    <text x="1165" y="154" font-size="9.5" text-anchor="middle" class="s">game over</text>

    <rect x="1090" y="340" width="150" height="60" rx="8" class="io"/>
    <text x="1165" y="366" font-size="13" font-weight="bold" text-anchor="middle" class="t">16×16 red/green</text>
    <text x="1165" y="384" font-size="9.5" text-anchor="middle" class="s">LED matrix</text>
  </g>

  <!-- ===================== module boxes ===================== -->
  <!-- timing group (blue bar) -->
  <g>
    <rect x="200" y="92" width="170" height="64" rx="8" class="box"/>
    <rect x="200" y="92" width="5" height="64" rx="2.5" class="lb-b"/>
    <text x="285" y="118" font-size="14" font-weight="bold" text-anchor="middle" class="t">clock_divider</text>
    <text x="285" y="136" font-size="10.5" text-anchor="middle" class="s">32-bit · div_clk[9]</text>

    <rect x="200" y="200" width="170" height="64" rx="8" class="box"/>
    <rect x="200" y="200" width="5" height="64" rx="2.5" class="lb-b"/>
    <text x="285" y="226" font-size="14" font-weight="bold" text-anchor="middle" class="t">clock_divider</text>
    <text x="285" y="244" font-size="10.5" text-anchor="middle" class="s">GT tap for game tick</text>
  </g>

  <!-- inline top-level logic (dashed) -->
  <g>
    <rect x="440" y="200" width="150" height="64" rx="8" class="logic"/>
    <text x="515" y="222" font-size="13.5" font-weight="bold" text-anchor="middle" class="t">edge detect</text>
    <text x="515" y="238" font-size="10" text-anchor="middle" class="s">GT → oneGT pulse</text>
    <text x="515" y="252" font-size="9.5" font-style="italic" text-anchor="middle" class="m">top-level logic</text>

    <rect x="440" y="280" width="150" height="72" rx="8" class="logic"/>
    <text x="515" y="304" font-size="13.5" font-weight="bold" text-anchor="middle" class="t">direction lock</text>
    <text x="515" y="320" font-size="10" text-anchor="middle" class="s">blocks 180° turns</text>
    <text x="515" y="336" font-size="9.5" font-style="italic" text-anchor="middle" class="m">top-level logic</text>
  </g>

  <!-- game logic group (orange bar) -->
  <g>
    <rect x="200" y="280" width="170" height="72" rx="8" class="box"/>
    <rect x="200" y="280" width="5" height="72" rx="2.5" class="lb-o"/>
    <text x="285" y="304" font-size="14" font-weight="bold" text-anchor="middle" class="t">userInput ×4</text>
    <text x="285" y="320" font-size="10.5" text-anchor="middle" class="s">sync + 1-cycle edge pulse</text>
    <text x="285" y="336" font-size="10.5" text-anchor="middle" class="s">clk: clkSelect</text>

    <rect x="640" y="280" width="180" height="110" rx="8" class="box"/>
    <rect x="640" y="280" width="5" height="110" rx="2.5" class="lb-o"/>
    <text x="730" y="310" font-size="15" font-weight="bold" text-anchor="middle" class="t">snake</text>
    <text x="730" y="327" font-size="10.5" text-anchor="middle" class="s">game core</text>
    <text x="730" y="343" font-size="10.5" text-anchor="middle" class="s">clk: clkSelect</text>
    <text x="730" y="359" font-size="10.5" text-anchor="middle" class="s">tick: oneGT</text>

    <rect x="640" y="470" width="180" height="70" rx="8" class="box"/>
    <rect x="640" y="470" width="5" height="70" rx="2.5" class="lb-o"/>
    <text x="730" y="496" font-size="14" font-weight="bold" text-anchor="middle" class="t">apple</text>
    <text x="730" y="512" font-size="10.5" text-anchor="middle" class="s">rejects occupied cells</text>
    <text x="730" y="528" font-size="10.5" text-anchor="middle" class="s">clk: clkSelect</text>

    <rect x="200" y="470" width="170" height="70" rx="8" class="box"/>
    <rect x="200" y="470" width="5" height="70" rx="2.5" class="lb-o"/>
    <text x="285" y="496" font-size="14" font-weight="bold" text-anchor="middle" class="t">LFSR</text>
    <text x="285" y="512" font-size="10.5" text-anchor="middle" class="s">8-bit random taps</text>
    <text x="285" y="528" font-size="10.5" text-anchor="middle" class="s">clk: clkSelect</text>
  </g>

  <!-- display group (teal bar) -->
  <g>
    <rect x="860" y="280" width="150" height="110" rx="8" class="box"/>
    <rect x="860" y="280" width="5" height="110" rx="2.5" class="lb-t"/>
    <text x="935" y="310" font-size="14" font-weight="bold" text-anchor="middle" class="t">LEDDriver</text>
    <text x="935" y="327" font-size="10.5" text-anchor="middle" class="s">row scan, 16×16×2</text>
    <text x="935" y="343" font-size="10.5" text-anchor="middle" class="s">clk: clkSelect</text>
  </g>

  <!-- ===================== legend ===================== -->
  <g>
    <line x1="170" y1="646" x2="205" y2="646" class="ln-b"/>
    <text x="211" y="650" font-size="11" class="lg">clock / timing</text>
    <line x1="330" y1="646" x2="365" y2="646" class="ln-o"/>
    <text x="371" y="650" font-size="11" class="lg">game data</text>
    <line x1="470" y1="646" x2="505" y2="646" class="ln-g"/>
    <text x="511" y="650" font-size="11" class="lg">control / status</text>
    <rect x="640" y="638" width="26" height="14" rx="3" fill="none" stroke="var(--mut)" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="674" y="650" font-size="11" class="lg">top-level inline logic (not a separate file)</text>
  </g>
</svg>
